<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurser</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <section>
    <div class="container">
      <h1>Kursanmälan</h1>
      <form action="">
        <input id="name" type="text" placeholder="Ange ditt namn"><br><br>
        <input id="email" type="email" placeholder="Ange din e-postadress"><br><br>
        <input id="number" type="text" placeholder="Ange ditt telefonnummer"><br><br>
        <input id="age" type="number" placeholder="Ange din ålder"><br><br>
        <select name="kurs" id="">
          <option value="">Välj en kurs</option>
          <option value="IT">IT - teknik</option>
          <option value="natur">Natur</option>
          <option value="samhäll">Samhäll</option>
          <option value="ekonomi">Ekonomi</option>
        </select><br><br>
        <input id="pass" type="password" placeholder="Ange et lösenord"><br><br>
        <button id="btn">Skicka In</button>
      </form>
    </div>
  </section>
  <script src="main.js"></script>
</body>
</html>
